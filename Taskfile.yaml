# Common procedures as code (https://taskfile.dev). Anything mechanical
# lives here rather than in prompts or muscle memory: `task --list`.
version: "3"

vars:
  FUZZTIME: '{{ .FUZZTIME | default "300s" }}'
  # Stamp local builds so --version says exactly what you're running
  # (e.g. v0.1.1-2-gb22590b-dirty). goreleaser stamps releases with the
  # tag instead; a plain `go build` leaves the dev/none/unknown defaults.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date +%Y-%m-%dT%H:%M:%S%z
  LDFLAGS: "-X main.version={{ .VERSION }} -X main.commit={{ .COMMIT }} -X main.date={{ .DATE }}"

tasks:
  default:
    deps: [verify]

  build:
    desc: "Build ./bin/mdreflow for local use, version-stamped from git describe"
    cmds:
      - go build -ldflags "{{ .LDFLAGS }}" -o bin/mdreflow ./cmd/mdreflow

  install:
    desc: "go install mdreflow into GOBIN, version-stamped from git describe"
    cmds:
      - go install -ldflags "{{ .LDFLAGS }}" ./cmd/mdreflow

  verify:
    desc: "Full verification chain: build, vet, gofmt, lint, tests, dogfood"
    cmds:
      - go build ./...
      - go vet ./...
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - golangci-lint run
      - go test ./... -count=1
      - task: dogfood-check

  fuzz:
    desc: "Foreground fuzz soak (FUZZTIME=300s default); required after any reflow-logic change"
    cmds:
      - go test -fuzz=FuzzFormat -fuzztime={{ .FUZZTIME }} .

  fuzz-gate:
    desc: "Release-gate fuzz soak (FUZZTIME=300s default): fails only on panics, typed-refusal breaches, and production instability; records core idempotency/render findings to fuzz-gate.log"
    cmds:
      - rm -f fuzz-gate.log
      - MDREFLOW_FUZZ_GATE=1 go test -fuzz=FuzzFormat -fuzztime={{ .FUZZTIME }} .
      - cmd: 'test -s fuzz-gate.log && { echo "--- recorded (non-gating) findings ---"; cat fuzz-gate.log; } || echo "no non-gating findings recorded"'
        ignore_error: true

  vulncheck:
    desc: "Run govulncheck locally (also runs weekly + on tags in CI)"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dogfood:
    desc: "Format the repo's own Markdown with mdreflow"
    cmds:
      - go run ./cmd/mdreflow .

  dogfood-check:
    desc: "Check the repo's own Markdown is formatted (CI-style, exit 1 if not)"
    cmds:
      - go run ./cmd/mdreflow --check .

  release-prep:
    desc: "Bump version references (pre-commit rev in README and .pre-commit-hooks.yaml) to VERSION"
    requires:
      vars: [VERSION]
    cmds:
      - "sed -i -E 's|rev: v[0-9]+\\.[0-9]+\\.[0-9]+|rev: {{ .VERSION }}|' README.md .pre-commit-hooks.yaml"
      - "grep -q 'rev: {{ .VERSION }}' README.md"
      - "grep -q 'rev: {{ .VERSION }}' .pre-commit-hooks.yaml"
      - 'echo "pre-commit rev -> {{ .VERSION }} in README.md and .pre-commit-hooks.yaml; commit alongside the CHANGELOG retitle"'

  release-notes:
    desc: "Print the GitHub release notes for VERSION (extracted from CHANGELOG.md)"
    requires:
      vars: [VERSION]
    cmds:
      - scripts/release-notes.sh {{ .VERSION }}

  release-verify:
    desc: "Download VERSION's linux/amd64 release asset, verify checksum, smoke-test the binary"
    requires:
      vars: [VERSION]
    vars:
      TMP:
        sh: mktemp -d
    cmds:
      - defer: rm -rf {{ .TMP }}
      - gh release download {{ .VERSION }} -R jbeda/mdreflow -D {{ .TMP }} -p 'mdreflow_*_linux_amd64.tar.gz' -p checksums.txt
      - cd {{ .TMP }} && grep linux_amd64 checksums.txt | sha256sum -c -
      - cd {{ .TMP }} && tar xzf mdreflow_*_linux_amd64.tar.gz mdreflow
      - '{{ .TMP }}/mdreflow --version'
      - printf 'Two sentences here. Split please.\n' | {{ .TMP }}/mdreflow | diff - <(printf 'Two sentences here.\nSplit please.\n')
      # Pull the version through the public module proxy (makes it visible
      # to `go install @latest`). This one is a real gate: the proxy either
      # has the version or the release did not land.
      - "curl -sf -o /dev/null https://proxy.golang.org/github.com/jbeda/mdreflow/@v/{{ .VERSION }}.info"
      # Then ask pkg.go.dev to index it and wait for the page. Indexing is
      # asynchronous, and the /fetch endpoint answers 408 ("still working on
      # it") both while indexing and after the version is already live — so
      # its status says nothing about success and must not gate the task.
      # The page itself is the real signal; it is polled, and a miss is
      # reported rather than failed, since a lagging index does not make a
      # published release bad.
      - cmd: |
          curl -s -X POST -o /dev/null https://pkg.go.dev/fetch/github.com/jbeda/mdreflow@{{ .VERSION }} || true
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://pkg.go.dev/github.com/jbeda/mdreflow@{{ .VERSION }})
            if [ "$code" = "200" ]; then echo "pkg.go.dev is serving {{ .VERSION }}"; exit 0; fi
            sleep 15
          done
          echo "NOTE: pkg.go.dev has not indexed {{ .VERSION }} yet (last HTTP $code); the release itself is fine, re-check later."
      - "curl -sf -o /dev/null https://pkg.go.dev/github.com/jbeda/mdreflow@{{ .VERSION }} && echo 'pkg.go.dev indexed {{ .VERSION }}' || echo 'pkg.go.dev not showing {{ .VERSION }} yet (indexing lags; re-check in a few minutes)'"
      - echo "release {{ .VERSION }} verified"

name: govulncheck

# Deliberately not per-push: vulnerability findings are unrelated to any
# given diff, and the two-dependency surface here changes rarely. Weekly,
# on release tags, and on demand.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

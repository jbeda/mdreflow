name: govulncheck

# Deliberately not per-push: vulnerability findings are unrelated to any
# given diff, and the two-dependency surface here changes rarely. Weekly,
# on release tags, and on demand.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

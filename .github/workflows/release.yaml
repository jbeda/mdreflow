name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full history and all tags, not the default
          # shallow clone.
          fetch-depth: 0
      # A v* tag cut from any branch would otherwise fire a public release.
      # GitHub can't branch-filter a tag trigger, so guard at runtime: the
      # tagged commit must be contained in main's history.
      - name: Ensure the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::release tags must be cut from a commit on main; $GITHUB_SHA is not on main"
            exit 1
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Extract release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned, not floated: a goreleaser minor could change release
          # behavior underneath an unchanged config.
          version: "v2.17.1"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents read/write on jbeda/homebrew-tap;
          # the default GITHUB_TOKEN cannot push cross-repo.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

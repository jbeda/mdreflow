name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # goreleaser needs full history and all tags, not the default
          # shallow clone.
          fetch-depth: 0
      # A v* tag cut from any branch would otherwise fire a public release.
      # GitHub can't branch-filter a tag trigger, so guard at runtime: the
      # tagged commit must be contained in main's history.
      - name: Ensure the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::release tags must be cut from a commit on main; $GITHUB_SHA is not on main"
            exit 1
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Extract release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          # Pinned, not floated: a goreleaser minor could change release
          # behavior underneath an unchanged config.
          version: "v2.16.0"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
